<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250">
  <defs>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42275a"/>
      <stop offset="100%" stop-color="#734b6d"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="360 220 125" to="0 220 125" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="440" height="250" rx="16" fill="url(#a2)"/>
  <rect x="6" y="6" width="428" height="238" rx="12" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="4s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <g fill="#bfe9ff">
    <circle cx="120" cy="50" r="2.5"><animate attributeName="cy" values="250;-5" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="50" r="2"><animate attributeName="cy" values="250;-5" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="220" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" opacity="0.95">✨ 二次元图片待补充</text>
  <text x="220" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#bfe9ff" opacity="0.85">Anime image placeholder</text>
</svg>
