<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="100%" stop-color="#7597de"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 220 125" to="360 220 125" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="440" height="250" rx="16" fill="url(#a1)"/>
  <rect x="6" y="6" width="428" height="238" rx="12" fill="none" stroke="#f093fb" stroke-width="2" stroke-dasharray="10 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g fill="#ffd1e8">
    <circle cx="330" cy="60" r="2.5"><animate attributeName="cy" values="250;-5" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="60" r="2"><animate attributeName="cy" values="250;-5" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="60" r="2.5"><animate attributeName="cy" values="250;-5" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <text x="220" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" opacity="0.95">🌸 二次元图片待补充</text>
  <text x="220" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ffd1e8" opacity="0.85">Anime image placeholder</text>
</svg>
