<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </radialGradient>
    <linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="142" fill="url(#halo)">
    <animate attributeName="r" values="128;146;128" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(150,150)">
    <!-- 外环 -->
    <circle r="128" fill="none" stroke="url(#ringg)" stroke-width="1.8" stroke-dasharray="8 13" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="103" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" fill="none" stroke="#ff2fd6" stroke-width="0.8" stroke-dasharray="1 8" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- 环绕卫星 -->
    <circle cx="128" cy="0" r="5" fill="#00f0ff">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-103" cy="0" r="4" fill="#ff2fd6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-70" r="3" fill="#a855f7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- 脉冲核心 -->
    <circle r="48" fill="url(#core)" opacity="0.95">
      <animate attributeName="r" values="42;54;42" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#00f0ff" stroke-width="2.2" opacity="0.9">
      <animate attributeName="r" values="48;82;48" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#ff2fd6" stroke-width="1.6" opacity="0.7">
      <animate attributeName="r" values="48;70;48" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <text y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" opacity="0.98">AI</text>
  </g>
</svg>
