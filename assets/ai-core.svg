<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </radialGradient>
    <linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
  </defs>

  <g transform="translate(140,140)">
    <!-- 外环 -->
    <circle r="122" fill="none" stroke="url(#ringg)" stroke-width="1.6" stroke-dasharray="7 12" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="98" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="2 9" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- 环绕卫星 -->
    <circle cx="122" cy="0" r="4.5" fill="#6bcbff">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-98" cy="0" r="3.5" fill="#f093fb">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- 脉冲核心 -->
    <circle r="46" fill="url(#core)" opacity="0.95">
      <animate attributeName="r" values="40;52;40" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.85">
      <animate attributeName="r" values="46;76;46" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="none" stroke="#f093fb" stroke-width="1.5" opacity="0.7">
      <animate attributeName="r" values="46;66;46" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- 中心文字 -->
    <text y="9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" opacity="0.95">AI</text>
  </g>
</svg>
