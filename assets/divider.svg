<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>
  <line x1="24" y1="10" x2="776" y2="10" stroke="url(#dl)" stroke-width="2" stroke-linecap="round" stroke-dasharray="28 12" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="24" cy="10" r="3.2" fill="#00f2fe">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="776" cy="10" r="3.2" fill="#f093fb">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
