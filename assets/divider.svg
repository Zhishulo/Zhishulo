<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 22" width="800" height="22">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="65%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <radialGradient id="dg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="11" r="18" fill="url(#dg)">
    <animate attributeName="r" values="12;22;12" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="30" y1="11" x2="770" y2="11" stroke="url(#dl)" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 12" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-84" dur="3s" repeatCount="indefinite"/>
  </line>
  <rect x="394" y="5" width="12" height="12" transform="rotate(45 400 11)" fill="#00f0ff" opacity="0.95">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="30" cy="11" r="3.4" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="11" r="3.4" fill="#ff2fd6">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
