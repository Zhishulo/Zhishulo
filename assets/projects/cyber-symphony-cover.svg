<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <defs>
    <linearGradient id="cs1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07030f"/>
      <stop offset="100%" stop-color="#2b1055"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 260 110" to="360 260 110" dur="20s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="cs2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-260 0" to="260 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="520" height="220" rx="16" fill="url(#cs1)"/>
  <rect x="6" y="6" width="508" height="208" rx="12" fill="none" stroke="url(#cs2)" stroke-width="2" stroke-dasharray="14 9" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-92" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g fill="#00f0ff">
    <circle cx="90" cy="180" r="2"><animate attributeName="cy" values="230;-5" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="180" r="2.4"><animate attributeName="cy" values="230;-5" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="180" r="2"><animate attributeName="cy" values="230;-5" dur="10s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="260" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="url(#cs2)" letter-spacing="4">CYBER SYMPHONY</text>
  <text x="260" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bfe9ff" letter-spacing="3">像素天气 × 经典乐章 · 待补充封面</text>
</svg>
